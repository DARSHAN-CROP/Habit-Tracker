<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#00897B"><title>ટેવ ટ્રેકર / Habit Tracker</title>
<style>:root{--c:#00897B;--bg:#f5f6f8;--ink:#1b1b1f;--mut:#6b6b76}*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Gujarati",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:40px}
header{background:var(--c);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:8px;position:sticky;top:0}header h1{margin:0;font-size:19px;flex:1}header button{background:#fff3;border:0;color:#fff;padding:8px 12px;border-radius:10px}
main{max-width:640px;margin:0 auto;padding:14px}.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px #0001}
input,select{width:100%;padding:11px;border:1px solid #d8dbe0;border-radius:10px;font-size:16px;margin:5px 0;background:#fff;color:var(--ink)}.btn{width:100%;padding:12px;border:0;border-radius:12px;background:var(--c);color:#fff;font-size:16px;font-weight:700;margin-top:6px}.btn.g{background:#e8eaee;color:var(--ink)}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1}.muted{color:var(--mut);font-size:13px}.big{font-size:18px;font-weight:700}.x{background:none;border:0;color:#c33;font-size:18px}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;text-align:right;border-bottom:1px solid #eee}th:first-child,td:first-child{text-align:left}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;background:#eef;font-size:12px;margin:2px}.ok{color:#1E9E63}.bad{color:#D64545}.bar{height:10px;border-radius:6px;background:#e8eaee;overflow:hidden}.bar i{display:block;height:100%;background:var(--c)}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid #d8dbe0;background:#fff;font-size:14px}.dot.on{background:var(--c);color:#fff;border-color:var(--c)}</style></head><body>
<header><h1 id="ttl"></h1><button id="lang"></button></header><main id="m"></main><script>
var gu=localStorage.getItem("lang_habit")!=="en";function $(s){return document.querySelector(s)}function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function el(h){var d=document.createElement("div");d.innerHTML=h;return d.firstChild}function t(k){return T[k]?T[k][gu?0:1]:k}
function inr(n){return "₹"+Math.round(n).toLocaleString("en-IN")}
$("#lang").onclick=function(){gu=!gu;localStorage.setItem("lang_habit",gu?"gu":"en");render()};

var T={ttl:["ટેવ ટ્રેકર","Habit Tracker"],add:["+ નવી ટેવ","+ New habit"],ph:["દા.ત. રોજ 30 મિનિટ વાંચન","e.g. Read 30 minutes"],streak:["દિવસ સતત","day streak"],best:["શ્રેષ્ઠ","best"],today:["આજે","Today"],none:["હજી કોઈ ટેવ નથી. ઉપર લખીને ઉમેરો.","No habits yet. Add one above."],done:["આજે પૂરું થયું: ","Done today: "],sure:["આ ટેવ કાઢી નાખવી છે?","Delete this habit?"],week:["છેલ્લા 7 દિવસ","Last 7 days"]};
var S;try{S=JSON.parse(localStorage.getItem("habit_v1"))}catch(e){}S=S||{h:[]};function save(){localStorage.setItem("habit_v1",JSON.stringify(S))}
function key(d){var y=d.getFullYear(),m=d.getMonth()+1,x=d.getDate();return y+"-"+(m<10?"0":"")+m+"-"+(x<10?"0":"")+x}
function back(n){var d=new Date();d.setDate(d.getDate()-n);return d}
function streak(h){var n=0,i=h.days[key(back(0))]?0:1;while(h.days[key(back(i))]){n++;i++}return n}
function best(h){var ks=Object.keys(h.days).sort(),b=0,c=0,prev=null;ks.forEach(function(k){var d=new Date(k+"T00:00:00");if(prev&&Math.round((d-prev)/864e5)===1)c++;else c=1;if(c>b)b=c;prev=d});return b}
function render(){$("#ttl").textContent=t("ttl");$("#lang").textContent=gu?"English":"ગુજરાતી";var m=$("#m");m.innerHTML="";
 var f=el('<div class="card"><div class="row"><input id="n" class="grow" placeholder="'+t("ph")+'"><button class="btn" id="a" style="width:auto;padding:12px 16px;margin:0">'+t("add")+'</button></div></div>');
 f.querySelector("#a").onclick=function(){var v=f.querySelector("#n").value.trim();if(v){S.h.push({id:Date.now(),n:v,days:{}});save();render()}};m.appendChild(f);
 var dn=S.h.filter(function(h){return h.days[key(back(0))]}).length;
 if(S.h.length)m.appendChild(el('<div class="card"><div class="muted">'+t("done")+'</div><div class="big">'+dn+" / "+S.h.length+'</div><div class="bar" style="margin-top:8px"><i style="width:'+Math.round(dn*100/S.h.length)+'%"></i></div></div>'));
 else m.appendChild(el('<div class="muted" style="text-align:center">'+t("none")+'</div>'));
 S.h.forEach(function(h){var c=el('<div class="card"><div class="row"><div class="grow big">'+esc(h.n)+'</div><button class="x">✕</button></div><div class="muted">🔥 '+streak(h)+" "+t("streak")+" • "+t("best")+" "+best(h)+'</div><div class="row" style="margin-top:10px;justify-content:space-between"></div></div>');
  c.querySelector(".x").onclick=function(){if(confirm(t("sure"))){S.h=S.h.filter(function(x){return x.id!==h.id});save();render()}};
  var rw=c.querySelector(".row:last-child");for(var i=6;i>=0;i--)(function(i){var k=key(back(i)),d=back(i);var b=el('<div style="text-align:center"><div class="muted" style="font-size:11px">'+d.toLocaleDateString("en-GB",{weekday:"short"})+'</div><button class="dot'+(h.days[k]?" on":"")+'">'+(h.days[k]?"✓":d.getDate())+'</button></div>');b.querySelector("button").onclick=function(){if(h.days[k])delete h.days[k];else h.days[k]=1;save();render()};rw.appendChild(b)})(i);
  m.appendChild(c)})}
render();

</script></body></html>
